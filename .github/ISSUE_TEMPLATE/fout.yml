name: Fout
description: Log a recurring mistake to track and eliminate it
title: "[fout]: "
labels: ["fout"]
body:
  - type: dropdown
    id: onderdeel
    attributes:
      label: Onderdeel
      options:
        - schrijven
        - spreken
        - knm
        - lezen
        - luisteren
    validations:
      required: true
  - type: textarea
    id: fout
    attributes:
      label: Wat ging er fout?
      description: Wat schreef/zei je, en wat is er niet correct aan?
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correcte vorm
      description: Wat had het moeten zijn?
    validations:
      required: true
  - type: textarea
    id: waarom
    attributes:
      label: Waarom (regel/patroon)
      description: De onderliggende regel, zodat je 'm herkent volgende keer.
